[project]
name = "chatgpt-openai-proxy"
version = "1.0.0"
description = "Proxy OpenAI/Anthropic compatível que roteia requests para o ChatGPT Plan (Codex) via OAuth, com multi-usuário e API keys."
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "litellm>=1.67",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "sqlmodel>=0.0.22",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
# Garante que a raiz do projeto esteja no sys.path (ex.: `uv run pytest` no
# CI não adiciona o cwd como `python -m pytest` faz).
pythonpath = ["."]

[tool.fastapi]
entrypoint = "app.main:app"
