services:
  chatgpt-proxy:
    build: .
    container_name: chatgpt-openai-proxy
    ports:
      - "3000:3000"
      - "1455:1455"
    environment:
      - PORT=3000
      - OAUTH_CALLBACK_PORT=1455
      # Modo headless (sem fluxo OAuth no container):
      # Preencha via .env ou Docker secret.
      # - CHATGPT_ACCESS_TOKEN=${CHATGPT_ACCESS_TOKEN:-}
      # - CHATGPT_REFRESH_TOKEN=${CHATGPT_REFRESH_TOKEN:-}
      # - CHATGPT_ACCOUNT_ID=${CHATGPT_ACCOUNT_ID:-}
      # - CHATGPT_EXPIRES_AT=${CHATGPT_EXPIRES_AT:-}
    volumes:
      - ./data:/root/.config/chatgpt-proxy
    restart: unless-stopped
