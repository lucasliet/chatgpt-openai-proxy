services:
  chatgpt-proxy:
    image: ghcr.io/lucasliet/chatgpt-openai-proxy:latest
    pull_policy: always
    container_name: chatgpt-proxy
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      # SQLite + token.key (criptografia dos tokens OAuth) ficam no volume /data.
      # Para usar Postgres, defina DATABASE_URL e, obrigatoriamente,
      # TOKEN_ENCRYPTION_KEY (gere com: python -c "from cryptography.fernet
      # import Fernet; print(Fernet.generate_key().decode())").
    volumes:
      - ./data:/data
    restart: unless-stopped
