services:
  chatgpt-proxy:
    image: ghcr.io/lucasliet/chatgpt-openai-proxy:latest
    pull_policy: always
    container_name: chatgpt-openai-proxy
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    volumes:
      - ./data:/root/.config/chatgpt-proxy
    restart: unless-stopped
